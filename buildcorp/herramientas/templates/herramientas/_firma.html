<div class="campo campo--ancho firma" data-firma>
  <label id="etiqueta-firma">{{ etiqueta }}</label>
  <div class="firma-area">
    <canvas aria-labelledby="etiqueta-firma" role="img"></canvas>
    <div class="firma-guia"><span class="firma-indicacion">Firme aquí con el dedo, lápiz o mouse</span></div>
  </div>
  <div class="firma-pie">
    <span data-firma-aviso role="alert"></span>
    <button type="button" class="boton boton--chico" data-firma-limpiar>Limpiar firma</button>
  </div>
</div>
