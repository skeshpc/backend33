{% if pagina.paginator.num_pages > 1 %}
<nav class="paginacion" aria-label="Páginas">
  {% if pagina.has_previous %}<a class="boton boton--chico" href="?{% if parametros %}{{ parametros }}&amp;{% endif %}pagina={{ pagina.previous_page_number }}">Anterior</a>{% else %}<span></span>{% endif %}
  <span class="silencio chico">Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span>
  {% if pagina.has_next %}<a class="boton boton--chico" href="?{% if parametros %}{{ parametros }}&amp;{% endif %}pagina={{ pagina.next_page_number }}">Siguiente</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
